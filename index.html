<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Developer Studio Hub</title>

  <!-- FAVICON DATA URI -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236161ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polygon points='12 2 2 7 12 12 22 7 12 2'/><polyline points='2 17 12 22 22 17'/><polyline points='2 12 12 17 22 12'/></svg>" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.39.0/min/vs/editor/vscode-loader.min.css" />
  <style>
    :root {
      --bg-main: #111322;
      --bg-sidebar: #181b34;
      --bg-card: #22254b;
      --bg-card-hover: #2c305e;
      --accent: #6161ff;
      --accent-hover: #4b4bdf;
      --danger: #ff4d4f;
      --danger-hover: #d9363e;
      --success: #52c41a;
      --text-main: #ffffff;
      --text-muted: #9699b0;
      --border-color: #2d3159;
      --sidebar-width: 240px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* SIDEBAR & RESIZER (RESPONSIVE & RESIZABLE) */
    .sidebar {
      width: var(--sidebar-width);
      min-width: 180px;
      max-width: 450px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      z-index: 10;
      flex-shrink: 0;
      position: relative;
      transition: margin-left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.collapsed {
      margin-left: calc(var(--sidebar-width) * -1);
    }

    /* Resizer Line */
    .sidebar-resizer {
      position: absolute;
      top: 0;
      right: -3px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 15;
      transition: background 0.2s;
    }
    .sidebar-resizer:hover, .sidebar-resizer.is-resizing {
      background: var(--accent);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 16px;
      padding: 8px;
      margin-bottom: 20px;
      color: #fff;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      background: rgba(97, 97, 255, 0.15);
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .nav-section {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      margin: 12px 8px 6px;
      letter-spacing: 0.5px;
    }

    .tool-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13.5px;
      transition: all 0.15s;
      margin-bottom: 2px;
    }

    .tool-item:hover, .tool-item.active { background: var(--bg-card); color: #fff; }
    .tool-item-left { display: flex; align-items: center; gap: 12px; overflow: hidden; flex: 1; }
    .tool-item-actions { display: flex; gap: 6px; opacity: 0; transition: opacity 0.15s; }
    .tool-item:hover .tool-item-actions { opacity: 1; }
    .tool-action-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 12px; padding: 2px; }
    .tool-action-btn:hover { color: #fff; }

    .icon-svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }
    .btn-action:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--bg-card); border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: var(--bg-card-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: var(--danger-hover); }
    .btn-danger:disabled { opacity: 0.4; cursor: not-allowed; background: var(--bg-card); }

    /* WORKSPACE & TOP BAR */
    .main-workspace { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    .top-bar {
      height: 56px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--bg-main);
      gap: 16px;
    }

    .sidebar-toggle-btn {
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sidebar-toggle-btn:hover { color: #fff; border-color: var(--accent); background: var(--bg-card); }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 20px;
      flex: 1;
      max-width: 360px;
    }
    .search-box input { background: transparent; border: none; color: #fff; outline: none; font-size: 13px; width: 100%; }

    /* AUTH WIDGET */
    .auth-widget { display: flex; align-items: center; gap: 10px; }
    .btn-auth {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-auth:hover { background: var(--bg-card-hover); border-color: var(--accent); }
    .btn-passkey { background: var(--accent); border-color: var(--accent); }
    .btn-passkey:hover { background: var(--accent-hover); }
    
    .user-profile { display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: #fff; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 12px; font-weight: 600; color: #fff; }
    .role-badge { font-size: 10px; color: #4ade80; font-weight: 600; }
    .btn-logout { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 4px; font-size: 14px; }
    .btn-logout:hover { color: #ff5555; }

    /* TAB & VIEWPORT */
    .tab-bar { height: 40px; background: var(--bg-sidebar); display: flex; align-items: flex-end; padding-left: 12px; border-bottom: 1px solid var(--border-color); }
    .tab { height: 34px; padding: 0 12px; background: transparent; color: var(--text-muted); border-radius: 6px 6px 0 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; cursor: pointer; margin-right: 4px; border: 1px solid transparent; border-bottom: none; }
    .tab.active { background: var(--bg-main); color: #fff; border-color: var(--border-color); font-weight: 600; }
    .tab-close { width: 14px; height: 14px; opacity: 0.6; }

    .viewport { flex: 1; position: relative; }
    .tab-frame { width: 100%; height: 100%; border: none; position: absolute; inset: 0; display: none; }
    .tab-frame.active { display: block; }

    /* LAUNCHPAD */
    .launchpad { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; padding: 28px; overflow-y: auto; height: 100%; }
    .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; aspect-ratio: 1 / 1; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer; transition: all 0.2s ease; position: relative; }
    .card:hover { background: var(--bg-card-hover); transform: translateY(-4px); border-color: var(--accent); }
    .card-icon { width: 52px; height: 52px; background: rgba(255,255,255,0.05); border-radius: 14px; display: flex; align-items: center; justify-content: center; margin-bottom: 14px; color: var(--accent); }
    .card-icon .icon-svg { width: 28px; height: 28px; }
    .card-title { font-size: 14px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    .card-desc { font-size: 11.5px; color: var(--text-muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .card-actions { position: absolute; top: 12px; right: 12px; display: flex; gap: 6px; opacity: 0; transition: opacity 0.2s; }
    .card:hover .card-actions { opacity: 1; }
    .card-action-btn { background: rgba(0,0,0,0.4); border: none; color: var(--text-muted); width: 26px; height: 26px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 12px; }
    .card-action-btn:hover { background: var(--accent); color: #fff; }

    /* MODAL GENERAL */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(6px); z-index: 1000; }
    .modal.active { display: flex; align-items: center; justify-content: center; }
    .modal-content { background: var(--bg-sidebar); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
    
    .editor-container { width: 85vw; height: 85vh; }
    .editor-header { padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .editor-body { flex: 1; display: flex; }
    .editor-meta { width: 320px; padding: 20px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .form-input { background: var(--bg-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; color: #fff; outline: none; font-size: 13px; }

    .icon-picker-header { display: flex; gap: 6px; margin-bottom: 6px; }
    .icon-picker-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      background: var(--bg-main);
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      max-height: 140px;
      overflow-y: auto;
    }
    .icon-picker-item {
      display: flex; align-items: center; justify-content: center;
      padding: 8px; border-radius: 6px; cursor: pointer; color: var(--text-muted);
      border: 1px solid transparent;
    }
    .icon-picker-item:hover, .icon-picker-item.selected { background: var(--bg-card); color: var(--accent); border-color: var(--accent); }

    .lib-icon-card {
      background: var(--bg-main);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      position: relative;
      transition: all 0.2s;
    }
    .lib-icon-card:hover { border-color: var(--accent); background: var(--bg-card); }
    .lib-icon-card .icon-svg { width: 24px; height: 24px; color: var(--accent); }
    .lib-icon-name { font-size: 11px; color: var(--text-muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }

    .lib-icon-del {
      position: absolute; top: 4px; right: 4px;
      background: rgba(255,0,0,0.2); border: none; color: #ff5555;
      width: 18px; height: 18px; border-radius: 4px;
      font-size: 10px; cursor: pointer; display: none;
      align-items: center; justify-content: center;
    }
    .lib-icon-card:hover .lib-icon-del { display: flex; }

    /* TOAST NOTIFICATIONS */
    #toastContainer {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 250px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--bg-sidebar);
      border: 1px solid var(--border-color);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 10px;
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .toast.show { transform: translateX(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast.warning { border-color: #faad14; }

    @media (max-width: 640px) {
      .user-info { display: none; }
      .search-box { max-width: 100%; }
    }
  </style>
</head>
<body>

  <!-- TOAST CONTAINER -->
  <div id="toastContainer"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="appSidebar">
    <!-- ResizerHandle -->
    <div class="sidebar-resizer" id="sidebarResizer"></div>

    <div class="brand">
      <div class="brand-logo">
        <svg class="icon-svg" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      </div>
      Studio Hub
    </div>

    <div class="nav-section">Tool Workspace</div>
    <div id="sidebarList" style="flex: 1; overflow-y: auto;"></div>

    <!-- ADMIN EXCLUSIVE BUTTONS -->
    <div id="adminActionButtons" style="display: none; flex-direction: column; gap: 4px;">
      <button class="btn-action btn-secondary" onclick="openIconManager()">
        <svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Icon Library
      </button>

      <button class="btn-action" onclick="openEditor()">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Create New Tool
      </button>
    </div>
  </aside>

  <!-- WORKSPACE -->
  <main class="main-workspace">
    <div class="top-bar">
      <button class="sidebar-toggle-btn" onclick="toggleSidebar()" title="Toggle Sidebar (Ctrl+B)">
        <svg class="icon-svg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>

      <div class="search-box">
        <svg class="icon-svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search workspace tools..." oninput="filterTools()" />
      </div>

      <!-- GOOGLE & PASSKEY AUTH AREA -->
      <div class="auth-widget" id="authWidget"></div>
    </div>

    <div class="tab-bar" id="tabBar"></div>

    <div class="viewport" id="viewport">
      <div class="launchpad" id="launchpad"></div>
    </div>
  </main>

  <!-- CONFIRM DELETE DANGER MODAL -->
  <div class="modal" id="confirmDeleteModal">
    <div class="modal-content" style="width: 380px; padding: 24px; border: 1px solid var(--danger);">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px; color:var(--danger);">
        <svg class="icon-svg" style="width:28px; height:28px;" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <h3 style="margin:0; font-size:16px;">XÁC NHẬN XÓA DỮ LIỆU</h3>
      </div>
      <p id="deleteModalMsg" style="font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4;"></p>
      <p style="font-size: 12px; font-weight: 600; color: #fff; margin-bottom: 8px;">Nhập chữ <span style="color:var(--danger)">OKIE</span> để tiếp tục:</p>
      <input type="text" id="deleteConfirmInput" class="form-input" placeholder="Gõ OKIE..." style="margin-bottom: 16px; text-transform: uppercase;" oninput="validateDeleteInput()" />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn-action btn-secondary" onclick="closeDeleteModal()" style="margin:0; padding:8px 14px; font-size:12px;">Hủy bỏ</button>
        <button id="btnConfirmDeleteExecute" class="btn-action btn-danger" disabled onclick="executeDeleteAction()" style="margin:0; padding:8px 14px; font-size:12px;">Xóa Vĩnh Viễn</button>
      </div>
    </div>
  </div>

  <!-- PASSKEY MODAL -->
  <div class="modal" id="passkeyModal">
    <div class="modal-content" style="width: 320px; padding: 20px;">
      <h3 style="margin-bottom: 8px;">Admin Passkey</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 14px;">Nhập passcode admin để bật quyền quản trị:</p>
      <input type="password" id="passkeyInput" class="form-input" placeholder="Enter passkey..." style="margin-bottom: 14px;" />
      <div style="display: flex; justify-content: flex-end; gap: 8px;">
        <button class="btn-action btn-secondary" onclick="closePasskeyModal()" style="margin:0; padding:6px 12px; font-size:12px;">Hủy</button>
        <button class="btn-action" onclick="submitPasskey()" style="margin:0; padding:6px 12px; font-size:12px;">Xác nhận</button>
      </div>
    </div>
  </div>

  <!-- TOOL EDITOR MODAL -->
  <div class="modal" id="editorModal">
    <div class="modal-content editor-container">
      <div class="editor-header">
        <h3 id="editorTitle">Tool Code Studio</h3>
        <button onclick="closeEditor()" style="background:none; border:none; color:#fff; cursor:pointer;">✕ Close</button>
      </div>
      <div class="editor-body">
        <div class="editor-meta">
          <input type="hidden" id="editToolId" />
          <label style="font-size: 11px; color: var(--text-muted)">TOOL NAME</label>
          <input type="text" id="editTitle" class="form-input" placeholder="e.g. PCN Approval Matrix" />
          
          <label style="font-size: 11px; color: var(--text-muted)">SHORT DESCRIPTION</label>
          <input type="text" id="editDesc" class="form-input" placeholder="Enter purpose or function..." />

          <label style="font-size: 11px; color: var(--text-muted)">SELECT ICON FROM D1 DATABASE</label>
          <div class="icon-picker-header">
            <input type="text" id="iconSearchInput" class="form-input" style="flex:1" placeholder="🔍 Search icon tags..." oninput="filterIconsInPicker()" />
          </div>
          <div class="icon-picker-grid" id="iconPickerGrid"></div>

          <label style="font-size: 11px; color: var(--text-muted)">SVG CODE (AUTO-FILLED)</label>
          <textarea id="editIconSvg" class="form-input" rows="3" readonly placeholder="SVG string..."></textarea>

          <button class="btn-action" style="margin-top: auto" onclick="saveToolToD1()">Save to D1 Database</button>
        </div>
        <div id="monacoHost" style="flex:1;"></div>
      </div>
    </div>
  </div>

  <!-- ICON MANAGER MODAL -->
  <div class="modal" id="iconManagerModal">
    <div class="modal-content" style="width: 640px; max-height: 80vh; padding: 24px; display: flex; flex-direction: column; gap: 16px;">
      
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:12px;">
          <h3 style="margin:0;">Icon Library</h3>
          <span id="iconCountBadge" style="background:var(--accent); font-size:11px; padding:2px 8px; border-radius:10px; font-weight:600;">0 icons</span>
        </div>
        <button onclick="closeIconManager()" style="background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:16px;">✕</button>
      </div>

      <div style="display:flex; gap:10px; border-bottom:1px solid var(--border-color); padding-bottom:8px;">
        <button id="tabBtnBrowse" class="btn-action btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="switchIconTab('browse')">Browse Library</button>
        <button id="tabBtnAdd" class="btn-action btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="switchIconTab('add')">+ Add New Icon</button>
      </div>

      <div id="iconViewBrowse" style="display:flex; flex-direction:column; gap:12px; flex:1; overflow:hidden;">
        <input type="text" id="libSearchInput" class="form-input" placeholder="🔍 Search icons by name or tag..." oninput="filterLibIcons()" />
        <div id="libIconGrid" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap:12px; overflow-y:auto; padding-right:4px; max-height:360px;"></div>
      </div>

      <div id="iconViewAdd" style="display:none; flex-direction:column; gap:12px;">
        <input type="text" id="newIconName" class="form-input" placeholder="Icon Name (e.g. Terminal)" />
        <input type="text" id="newIconTags" class="form-input" placeholder="Search Tags (e.g. dev, code, cli)" />
        <textarea id="newIconSvg" class="form-input" rows="5" placeholder="Paste <svg>...</svg> code here..."></textarea>
        <button class="btn-action" onclick="saveNewIconToD1()">Save Icon to D1 Database</button>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.39.0/min/vs/loader.js"></script>
  <script>
    const ADMIN_PASSKEY = "admin123";
    let tools = [];
    let dbIcons = [];
    let openTabs = [];
    let activeTabId = null;
    let monacoEditorInstance = null;
    let pendingDeleteAction = null;

    // --- TOAST NOTIFICATION SYSTEM ---
    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      const iconMap = {
        success: '✅',
        error: '❌',
        warning: '⚠️'
      };

      toast.innerHTML = `<span>${iconMap[type] || 'ℹ️'}</span><span>${message}</span>`;
      container.appendChild(toast);

      setTimeout(() => toast.classList.add('show'), 10);
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    // --- SIDEBAR RESIZE & TOGGLE ---
    function toggleSidebar() {
      document.getElementById('appSidebar').classList.toggle('collapsed');
    }

    const sidebar = document.getElementById('appSidebar');
    const resizer = document.getElementById('sidebarResizer');
    let isResizing = false;

    resizer.addEventListener('mousedown', (e) => {
      isResizing = true;
      resizer.classList.add('is-resizing');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', (e) => {
      if (!isResizing) return;
      let newWidth = e.clientX;
      if (newWidth < 180) newWidth = 180;
      if (newWidth > 450) newWidth = 450;
      sidebar.style.width = newWidth + 'px';
      document.documentElement.style.setProperty('--sidebar-width', newWidth + 'px');
    });

    document.addEventListener('mouseup', () => {
      if (isResizing) {
        isResizing = false;
        resizer.classList.remove('is-resizing');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
      }
    });

    // --- AUTH STATE ---
    let currentUser = JSON.parse(localStorage.getItem('studio_user')) || {
      name: 'Guest Viewer',
      email: 'viewer@studiohub.local',
      role: 'viewer'
    };

    function updateAuthUI() {
      const widget = document.getElementById('authWidget');
      const adminActions = document.getElementById('adminActionButtons');

      if (currentUser.role === 'admin') {
        adminActions.style.display = 'flex';
        widget.innerHTML = `
          <div class="user-profile">
            <div class="user-avatar">${currentUser.name.charAt(0)}</div>
            <div class="user-info">
              <span class="user-name">${currentUser.name}</span>
              <span class="role-badge">🛡️ Admin</span>
            </div>
            <button class="btn-logout" onclick="logoutRole()" title="Thoát Role Admin">✕</button>
          </div>
        `;
      } else {
        adminActions.style.display = 'none';
        widget.innerHTML = `
          <button class="btn-auth btn-passkey" onclick="openPasskeyModal()">
            <span>🔑 Passkey Admin</span>
          </button>
          <button class="btn-auth" onclick="showToast('Tính năng OAuth Gmail đang chờ cấu hình Client ID', 'warning')">
            <svg style="width:13px; height:13px;" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.23v3.14C3.2 21.3 7.31 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.59H1.23C.44 8.16 0 9.98 0 12s.44 3.84 1.23 5.41l4.05-3.14z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.2 2.7 1.23 6.59l4.05 3.14c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            <span>Gmail</span>
          </button>
        `;
      }
      renderUI();
    }

    function openPasskeyModal() {
      document.getElementById('passkeyInput').value = '';
      document.getElementById('passkeyModal').classList.add('active');
    }

    function closePasskeyModal() {
      document.getElementById('passkeyModal').classList.remove('active');
    }

    function submitPasskey() {
      const input = document.getElementById('passkeyInput').value.trim();
      if (input === ADMIN_PASSKEY) {
        currentUser = { name: 'Admin', email: 'admin@studiohub.local', role: 'admin' };
        localStorage.setItem('studio_user', JSON.stringify(currentUser));
        closePasskeyModal();
        updateAuthUI();
        showToast('Đã kích hoạt quyền Admin thành công!', 'success');
      } else {
        showToast('Passkey không đúng!', 'error');
      }
    }

    function logoutRole() {
      currentUser = { name: 'Guest Viewer', email: 'viewer@studiohub.local', role: 'viewer' };
      localStorage.setItem('studio_user', JSON.stringify(currentUser));
      updateAuthUI();
      showToast('Đã đăng xuất khỏi quyền Admin', 'warning');
    }

    // --- MONACO EDITOR INIT ---
    require.config({ paths: { 'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.39.0/min/vs' }});
    require(['vs/editor/editor.main'], function() {
      monacoEditorInstance = monaco.editor.create(document.getElementById('monacoHost'), {
        value: '<!-- Write HTML/JS code here -->',
        language: 'html', theme: 'vs-dark', automaticLayout: true
      });
    });

    async function loadIconsFromD1() {
      try {
        const res = await fetch('/api/icons');
        if (res.ok) {
          dbIcons = await res.json();
          renderIconPicker(dbIcons);
          renderLibIcons(dbIcons);
        }
      } catch (err) {
        showToast('Lỗi khi tải Icon từ D1 Database', 'error');
      }
    }

    async function loadToolsFromD1() {
      try {
        const res = await fetch('/api/tools');
        if (res.ok) {
          tools = await res.json();
          renderUI();
        }
      } catch (err) {
        showToast('Lỗi khi tải Tools từ D1 Database', 'error');
      }
    }

    // --- RENDER UI ---
    function renderUI() {
      const defaultSvg = `<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>`;
      const isAdmin = currentUser.role === 'admin';

      // Launchpad Cards
      document.getElementById('launchpad').innerHTML = tools.map(tool => `
        <div class="card" onclick="runTool('${tool.id}')">
          ${isAdmin ? `
            <div class="card-actions">
              <button class="card-action-btn" onclick="event.stopPropagation(); editTool('${tool.id}')" title="Edit Tool">✏️</button>
              <button class="card-action-btn" onclick="event.stopPropagation(); triggerDeleteTool('${tool.id}', '${tool.title}')" title="Delete Tool">🗑️</button>
            </div>
          ` : ''}
          <div class="card-icon">${tool.icon_svg || defaultSvg}</div>
          <div class="card-title">${tool.title}</div>
          <div class="card-desc">${tool.desc || ''}</div>
        </div>
      `).join('');

      // Sidebar List
      document.getElementById('sidebarList').innerHTML = tools.map(tool => `
        <div class="tool-item" onclick="runTool('${tool.id}')">
          <div class="tool-item-left">
            ${tool.icon_svg || defaultSvg}
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${tool.title}</span>
          </div>
          ${isAdmin ? `
            <div class="tool-item-actions">
              <button class="tool-action-btn" onclick="event.stopPropagation(); editTool('${tool.id}')" title="Edit">✏️</button>
              <button class="tool-action-btn" onclick="event.stopPropagation(); triggerDeleteTool('${tool.id}', '${tool.title}')" title="Delete">🗑️</button>
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    function filterTools() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.card');
      const items = document.querySelectorAll('.tool-item');
      
      tools.forEach((tool, idx) => {
        const match = tool.title.toLowerCase().includes(q) || (tool.desc && tool.desc.toLowerCase().includes(q));
        if (cards[idx]) cards[idx].style.display = match ? 'flex' : 'none';
        if (items[idx]) items[idx].style.display = match ? 'flex' : 'none';
      });
    }

    async function runTool(id) {
      let tool = tools.find(t => t.id === id);
      if (!tool.code_content) {
        const res = await fetch(`/api/tools?id=${id}`);
        tool = await res.json();
      }
      const blobUrl = URL.createObjectURL(new Blob([tool.code_content], { type: 'text/html' }));
      const tabId = 'tab_' + id + '_' + Date.now();
      openTabs.push({ tabId, toolId: id, title: tool.title, blobUrl });

      const iframe = document.createElement('iframe');
      iframe.id = 'frame_' + tabId;
      iframe.className = 'tab-frame';
      iframe.src = blobUrl;
      document.getElementById('viewport').appendChild(iframe);
      switchTab(tabId);
    }

    function switchTab(tabId) {
      activeTabId = tabId;
      document.querySelectorAll('.tab-frame').forEach(f => f.classList.remove('active'));
      document.getElementById('launchpad').style.display = 'none';
      document.getElementById('frame_' + tabId)?.classList.add('active');
      renderTabs();
    }

    function renderTabs() {
      document.getElementById('tabBar').innerHTML = openTabs.map(tab => `
        <div class="tab ${tab.tabId === activeTabId ? 'active' : ''}" onclick="switchTab('${tab.tabId}')">
          <span>${tab.title}</span>
          <span class="tab-close" onclick="closeTab(event, '${tab.tabId}')">✕</span>
        </div>
      `).join('');
    }

    function closeTab(e, tabId) {
      e.stopPropagation();
      document.getElementById('frame_' + tabId)?.remove();
      openTabs = openTabs.filter(t => t.tabId !== tabId);
      if (openTabs.length > 0) switchTab(openTabs[openTabs.length - 1].tabId);
      else { document.getElementById('launchpad').style.display = 'grid'; renderTabs(); }
    }

    // --- STRONG CONFIRM DELETE MODAL ---
    function triggerDeleteTool(id, title) {
      if (currentUser.role !== 'admin') { showToast('Bạn không có quyền Admin!', 'error'); return; }
      pendingDeleteAction = { type: 'tool', id };
      document.getElementById('deleteModalMsg').innerText = `Hành động này sẽ xóa vĩnh viễn Tool "${title}" khỏi D1 Database và không thể phục hồi.`;
      openDeleteModal();
    }

    function triggerDeleteIcon(id, name) {
      if (currentUser.role !== 'admin') { showToast('Bạn không có quyền Admin!', 'error'); return; }
      pendingDeleteAction = { type: 'icon', id };
      document.getElementById('deleteModalMsg').innerText = `Hành động này sẽ xóa vĩnh viễn Icon "${name}" khỏi D1 Database.`;
      openDeleteModal();
    }

    function openDeleteModal() {
      document.getElementById('deleteConfirmInput').value = '';
      document.getElementById('btnConfirmDeleteExecute').disabled = true;
      document.getElementById('confirmDeleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('confirmDeleteModal').classList.remove('active');
      pendingDeleteAction = null;
    }

    function validateDeleteInput() {
      const val = document.getElementById('deleteConfirmInput').value.trim().toUpperCase();
      document.getElementById('btnConfirmDeleteExecute').disabled = (val !== 'OKIE');
    }

    async function executeDeleteAction() {
      if (!pendingDeleteAction) return;
      const { type, id } = pendingDeleteAction;

      if (type === 'tool') {
        await fetch(`/api/tools?id=${id}`, { method: 'DELETE' });
        showToast('Đã xóa Tool thành công!', 'success');
        loadToolsFromD1();
      } else if (type === 'icon') {
        await fetch(`/api/icons?id=${id}`, { method: 'DELETE' });
        showToast('Đã xóa Icon khỏi Library!', 'success');
        await loadIconsFromD1();
      }

      closeDeleteModal();
    }

    // --- CRUD ACTIONS ---
    function openEditor() {
      if (currentUser.role !== 'admin') { showToast('Access Denied!', 'error'); return; }
      document.getElementById('editToolId').value = '';
      document.getElementById('editTitle').value = '';
      document.getElementById('editDesc').value = '';
      document.getElementById('editIconSvg').value = '';
      if(monacoEditorInstance) monacoEditorInstance.setValue('<!-- Write HTML/JS code here -->');
      document.getElementById('editorModal').classList.add('active');
    }

    async function editTool(id) {
      if (currentUser.role !== 'admin') { showToast('Access Denied!', 'error'); return; }
      const res = await fetch(`/api/tools?id=${id}`);
      const tool = await res.json();
      document.getElementById('editToolId').value = tool.id;
      document.getElementById('editTitle').value = tool.title;
      document.getElementById('editDesc').value = tool.desc || '';
      document.getElementById('editIconSvg').value = tool.icon_svg || '';
      if(monacoEditorInstance) monacoEditorInstance.setValue(tool.code_content || '');
      document.getElementById('editorModal').classList.add('active');
    }

    function closeEditor() { document.getElementById('editorModal').classList.remove('active'); }

    async function saveToolToD1() {
      if (currentUser.role !== 'admin') return;
      const payload = {
        id: document.getElementById('editToolId').value,
        title: document.getElementById('editTitle').value,
        desc: document.getElementById('editDesc').value,
        icon_svg: document.getElementById('editIconSvg').value,
        code_content: monacoEditorInstance.getValue()
      };
      await fetch('/api/tools', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      closeEditor();
      showToast('Đã lưu Tool vào D1 Database thành công!', 'success');
      loadToolsFromD1();
    }

    // --- ICON PICKER & MANAGER ---
    function renderIconPicker(iconList) {
      const grid = document.getElementById('iconPickerGrid');
      if (!iconList || iconList.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted); font-size:11px; padding:8px;">No icons in DB</div>`;
        return;
      }
      grid.innerHTML = iconList.map(icon => `
        <div class="icon-picker-item" title="${icon.name} (${icon.tags || ''})" onclick="selectD1Icon('${icon.id}')">
          ${icon.svg_code}
        </div>
      `).join('');
    }

    function filterIconsInPicker() {
      const q = document.getElementById('iconSearchInput').value.toLowerCase();
      const filtered = dbIcons.filter(i => i.name.toLowerCase().includes(q) || (i.tags && i.tags.toLowerCase().includes(q)));
      renderIconPicker(filtered);
    }

    function selectD1Icon(iconId) {
      const icon = dbIcons.find(i => i.id === iconId);
      if (icon) {
        document.getElementById('editIconSvg').value = icon.svg_code;
        showToast(`Đã chọn icon: ${icon.name}`, 'success');
      }
    }

    function openIconManager() {
      if (currentUser.role !== 'admin') return;
      document.getElementById('iconManagerModal').classList.add('active');
      switchIconTab('browse');
      renderLibIcons(dbIcons);
    }

    function closeIconManager() { document.getElementById('iconManagerModal').classList.remove('active'); }

    function switchIconTab(tab) {
      const browseView = document.getElementById('iconViewBrowse');
      const addView = document.getElementById('iconViewAdd');
      const btnBrowse = document.getElementById('tabBtnBrowse');
      const btnAdd = document.getElementById('tabBtnAdd');

      if (tab === 'browse') {
        browseView.style.display = 'flex';
        addView.style.display = 'none';
        btnBrowse.style.background = 'var(--accent)';
        btnAdd.style.background = 'var(--bg-card)';
      } else {
        browseView.style.display = 'none';
        addView.style.display = 'flex';
        btnBrowse.style.background = 'var(--bg-card)';
        btnAdd.style.background = 'var(--accent)';
      }
    }

    function renderLibIcons(list) {
      document.getElementById('iconCountBadge').innerText = `${list.length} icons`;
      const grid = document.getElementById('libIconGrid');
      if (!list || list.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--text-muted); padding:20px; font-size:13px;">No icons found</div>`;
        return;
      }
      grid.innerHTML = list.map(icon => `
        <div class="lib-icon-card" title="${icon.name} (${icon.tags || ''})">
          <button class="lib-icon-del" onclick="triggerDeleteIcon('${icon.id}', '${icon.name}')" title="Delete Icon">✕</button>
          ${icon.svg_code}
          <span class="lib-icon-name">${icon.name}</span>
        </div>
      `).join('');
    }

    function filterLibIcons() {
      const q = document.getElementById('libSearchInput').value.toLowerCase();
      const filtered = dbIcons.filter(i => i.name.toLowerCase().includes(q) || (i.tags && i.tags.toLowerCase().includes(q)));
      renderLibIcons(filtered);
    }

    async function saveNewIconToD1() {
      const name = document.getElementById('newIconName').value.trim();
      const tags = document.getElementById('newIconTags').value.trim();
      const svg = document.getElementById('newIconSvg').value.trim();
      if (!name || !svg) { showToast('Vui lòng điền Name và mã SVG!', 'warning'); return; }
      
      await fetch('/api/icons', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, tags, svg_code: svg })
      });

      document.getElementById('newIconName').value = '';
      document.getElementById('newIconTags').value = '';
      document.getElementById('newIconSvg').value = '';
      showToast('Đã lưu Icon mới vào D1 Database!', 'success');
      await loadIconsFromD1();
      switchIconTab('browse');
    }

    // INIT APP
    updateAuthUI();
    loadIconsFromD1();
    loadToolsFromD1();
  </script>
</body>
</html>
